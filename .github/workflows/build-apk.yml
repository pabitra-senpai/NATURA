name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found. Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore found."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/NATURA.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATURA-debug-apk
          path: build-artifacts/NATURA.apk
          if-no-files-found: error

      - name: Delete Existing Latest Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          git tag -d latest || true

      - name: Publish Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NATURA - Latest Build"
          prerelease: true
          files: build-artifacts/NATURA.apk
          body: |
            ### NATURA Debug Build (Rolling)

            - **Commit**: `${{ github.sha }}`
            - **Commit Message**: ${{ github.event.head_commit.message || 'Manual build trigger' }}
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Latest' }}

            #### Direct Download
            Direct APK link: [NATURA.apk](https://github.com/${{ github.repository }}/releases/download/latest/NATURA.apk)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
